name: Bug report
description: Report a reproducible problem with Pane
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Pane. Do not include private URLs, tab titles, or browsing data.
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Pane, Zen Browser, and Sine versions
      placeholder: Pane 0.9.0; Zen 1.21.16b; Sine 2.3.4.1c
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include pane count, orientation, and whether the divider was resized.
    validations:
      required: true
  - type: checkboxes
    id: script_setup
    attributes:
      label: Sine script setup
      options:
        - label: Install JavaScript from unofficial sources is enabled in Sine.
          required: true
        - label: I toggled Pane off and on, then fully restarted Zen.
          required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Pane diagnostic report
      description: Press Ctrl+Alt+D, then paste the copied privacy-safe report here. If the shortcut did nothing, say so and attach a screenshot of Pane's Sine settings.
      render: text
    validations:
      required: true
  - type: textarea
    id: other_mods
    attributes:
      label: Other enabled browser-chrome mods
      description: List other Sine mods that run JavaScript, such as Advanced Tab Groups.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private URLs, page titles, and browsing information.
          required: true

<!doctype html><meta charset="utf-8"><title>Pane layout icon options</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#202126;font:14px system-ui}.sheet{width:1100px;margin:0 auto;padding:52px 60px}.head{display:flex;justify-content:space-between;border-bottom:1px solid #dddfe5;padding-bottom:22px;margin-bottom:34px}h1{font-size:34px;margin:0}.sub{color:#777985;margin-top:6px}.options{display:grid;grid-template-columns:1fr 1fr;gap:52px}.label{display:flex;justify-content:space-between;text-transform:uppercase;letter-spacing:.08em;font-size:11px;font-weight:750;color:#676974;margin-bottom:12px}.menu{padding:14px;border:1px solid #d8d9e0;border-radius:18px;background:linear-gradient(145deg,#f8f8fbdd,#f0f1f7ee);box-shadow:0 20px 45px #0002}.menuhead{padding:2px 7px 12px}.menuhead b{font-size:16px}.menuhead small{display:block;color:#848690;margin-top:3px}.row{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:9px;min-height:61px;padding:9px 11px;border:1px solid transparent;border-radius:12px}.row.selected{border-color:#9598db;background:#ededf8}.row b{display:block}.row small{display:block;color:#81838d;margin-top:3px}.current{padding:5px 8px;border-radius:7px;background:#ddddf1;color:#56598d;font-size:11px;font-weight:700}.ico{width:21px;height:21px;fill:none;stroke:#666a93;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.filled .ico{stroke:#565a82}.filled .shade{fill:#777baa;stroke:none;opacity:.9}.note{margin-top:13px;color:#8b8d97;font-size:12px}
</style><main class="sheet"><header class="head"><div><h1>Pane</h1><div class="sub">Layout menu icon directions</div></div><div class="sub">Lucide-based · UI comparison</div></header><div class="options">
<section><div class="label"><span>Option 1</span><span>Directional arrows</span></div><div class="menu" id="arrows"><div class="menuhead"><b>Arrange this tab</b><small>Project notes</small></div></div><p class="note">Movement is immediate and easy to scan.</p></section>
<section><div class="label"><span>Option 2</span><span>Filled layouts</span></div><div class="menu filled" id="filled"><div class="menuhead"><b>Arrange this tab</b><small>Project notes</small></div></div><p class="note">The destination shape is stronger and more visual.</p></section></div></main><script>
const rows=[['Split right','Place beside the other tabs','right'],['Split below','Place below the other tabs','below'],['Grid','Current layout','grid'],['Floating','Move and resize this tab','float'],['Return to a normal tab','Show this tab in the main view','normal']];
const arrow={right:'<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',below:'<path d="M12 5v14"/><path d="m19 12-7 7-7-7"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',float:'<path d="M2 10h6V4"/><path d="m2 4 6 6"/><rect x="12" y="14" width="10" height="7" rx="1"/>',normal:'<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>'};
const filled={right:'<rect x="3" y="4" width="18" height="16" rx="2"/><rect class="shade" x="13" y="5" width="7" height="14" rx="1"/>',below:'<rect x="3" y="4" width="18" height="16" rx="2"/><rect class="shade" x="4" y="13" width="16" height="6" rx="1"/>',grid:'<rect class="shade" x="3" y="3" width="8" height="8" rx="1"/><rect class="shade" x="13" y="3" width="8" height="8" rx="1"/><rect class="shade" x="3" y="13" width="8" height="8" rx="1"/><rect class="shade" x="13" y="13" width="8" height="8" rx="1"/>',float:'<rect x="3" y="3" width="18" height="18" rx="2"/><rect class="shade" x="11" y="11" width="9" height="8" rx="1.5"/>',normal:'<rect class="shade" x="4" y="4" width="16" height="16" rx="2"/>'};
for(const [id,icons] of [['arrows',arrow],['filled',filled]])for(const [title,desc,key] of rows){const row=document.createElement('div');row.className='row'+(key==='grid'?' selected':'');row.innerHTML=`<svg class="ico" viewBox="0 0 24 24">${icons[key]}</svg><span><b>${title}</b><small>${desc}</small></span>${key==='grid'?'<span class="current">Current</span>':''}`;document.getElementById(id).append(row)}
</script>
